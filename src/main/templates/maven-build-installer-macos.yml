# Use Maven to build a MacOS 11 x64 installer for Gamma
# This file is generated by Maven. Do not edit manually. Look in src/main/templates.

name: Build MacOS Installer

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/@gamma.release.tag@
      - name: Set up JDK @gamma.java.version@
        uses: actions/setup-java@v5
        with:
          java-version: '@gamma.java.version@'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build with Maven
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: MacOS X64 Package
          path: ./target/*.dmg
          if-no-files-found: error
