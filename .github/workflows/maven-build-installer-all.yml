# Use Maven to build a Debian installer for Gamma
# This file is generated by Maven. Do not edit manually. Look in src/main/templates.

name: Build All Installers

on: workflow_dispatch

jobs:
  build:
    strategy:
      matrix:
        include:

          # Ubuntu builds
          - os: ubuntu-20.04
            arch: amd64
            type: deb
          - os: ubuntu-22.04
            arch: arm64
            type: deb
          - os: ubuntu-24.04
            arch: amd64
            type: deb

          # macOS builds
          - os: macos-12
            arch: amd64
            type: dmg
          - os: macos-13
            arch: arm64
            type: dmg
          - os: macos-14
            arch: amd64
            type: dmg

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.type }} for ${{ matrix.os }} (${{ matrix.arch }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: refs/tags/v1.0.3-RC2

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          check-latest: true
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean package

      - uses: actions/upload-artifact@v4
        with:
          name: Asset ${{ matrix.type }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ./target/*.${{ matrix.type }}
          if-no-files-found: error
