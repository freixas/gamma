# Use Maven to build a Debian installer for Gamma
# This file is generated by Maven. Do not edit manually. Look in src/main/templates.

name: Build All Installers

on: workflow_dispatch

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            type: deb
          - os: ubuntu-24.04
            arch: x64
            type: deb
          - os: macos-14
            arch: arm64
            type: dmg
          - os: macos-15
            arch: arm64
            type: dmg

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.os }} (${{ matrix.arch }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: refs/tags/@gamma.release.tag@

      - name: Set up JDK @gamma.java.version@
        uses: actions/setup-java@v5
        with:
          java-version: '@gamma.java.version@'
          check-latest: true
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Asset ${{ matrix.type }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ./target/*.${{ matrix.type }}
          if-no-files-found: error

