# Use Maven to build a Debian installer for Gamma
# This file is generated by Maven. Do not edit manually. Look in src/main/templates.

name: Build Unix Installer

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        ref: refs/tags/@gamma.release.tag@
    - name: Set up JDK @gamma.java.version@
      uses: actions/setup-java@v5
      with:
        java-version: '@gamma.java.version@'
        check-latest: true
        distribution: 'temurin'
        cache: 'maven'
    - name: Build with Maven
      run: mvn -B clean package
    - uses: actions/upload-artifact@v4
      with:
        name: Debian X64 Package
        path: ./target/*.deb
        if-no-files-found: error
